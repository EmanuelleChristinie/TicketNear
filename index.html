function toPay(){const e=ev(S.ev);if(!e.pt)return;if(e.c=="Cinema"&&!S.sess)return toast("Escolha uma sessão");if(!S.seats.length)return toast("Selecione ao menos um ingresso");go("pay")}
function cupom(){if($("#cup").value.trim().toUpperCase()=="TICKET10"){S.cup=.1;toast("Cupom aplicado: 10% de desconto");draw()}else toast("Cupom inválido")}
function confirmar(tot){const f=S.f,V={nome:f.nome&&f.nome.trim().length>=3?"":"Informe seu nome completo",email:/^\S+@\S+\.\S+$/.test(f.email||"")?"":"Informe um e-mail válido",cpf:/^\d{11}$/.test(f.cpf||"")?"":"O CPF deve ter 11 números"};
if(S.pay=="cartao"){V.num=/^\d{16}$/.test(f.num||"")?"":"O cartão deve ter 16 números";V.val=/^(0[1-9]|1[0-2])\/\d{2}$/.test(f.val||"")?"":"Use o formato MM/AA";V.cvv=/^\d{3,4}$/.test(f.cvv||"")?"":"CVV com 3 ou 4 números"}
let bad=0;for(const k in V){const el=$("#"+k),er=$("#e_"+k);if(!el)continue;el.classList.toggle("bad",!!V[k]);er.textContent=V[k];if(V[k])bad++}
if(bad)return toast("Corrija os campos destacados");
const id="TN-"+Math.floor(1000+Math.random()*8999);S.tk.unshift({id,e:S.ev,seats:[...S.seats],lbl:lbl(ev(S.ev)),past:0,dist:900,ci:0});S.tab="prox";const n=S.seats.length;S.seats=[];S.cup=0;
modal(`<h2 style="margin-top:0">Compra confirmada</h2><p class="mute">Pedido de demonstração ${id} · ${R$(tot)}<br>${n} ingresso(s) ilustrativos para ${f.email}.</p><div style="display:flex;justify-content:center">${qr(id)}</div><div class="row" style="margin-top:16px"><button class="btn" onclick="closeM();go('tix')">Ver meus ingressos</button><button class="btn g" onclick="closeM();go('home')">Voltar ao início</button></div>`)}
function dist(id,v){const t=S.tk.find(x=>x.id==id);t.dist=+v;$("#dv"+id).textContent=v+" m";$("#ci"+id).disabled=t.dist>=200}
function checkin(id){const t=S.tk.find(x=>x.id==id);t.ci=1;S.pts+=50;draw();toast("Check-in confirmado! +50 pontos")}
function transfer(id){modal(`<h2 style="margin-top:0">Transferir ingresso</h2><p class="mute">O QR Code atual será invalidado e um novo será gerado para a pessoa.</p><label for="te">E-mail do destinatário</label><input id="te" placeholder="amiga@email.com"><div class="err" id="ter"></div><div class="row" style="margin-top:16px"><button class="btn" onclick="doT('${id}')">Transferir</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`)}
function doT(id){const v=$("#te").value;if(!/^\S+@\S+\.\S+$/.test(v)){$("#te").classList.add("bad");$("#ter").textContent="Informe um e-mail válido";return}S.tk=S.tk.filter(t=>t.id!=id);closeM();draw();toast("Ingresso transferido para "+v)}
function mural(){modal(`<h2 style="margin-top:0">Mural do evento</h2><div id="ch" class="mute" style="margin:10px 0"><p><b>Ana:</b> Chegando no portão B!</p><p><b>Lucas:</b> Setor norte já está lotando.</p></div><div class="row" style="flex-wrap:nowrap"><input id="msg" placeholder="Escreva uma mensagem"><button class="btn" onclick="const m=$('#msg');if(m.value.trim()){$('#ch').insertAdjacentHTML('beforeend','<p><b>Você:</b> '+m.value.replace(/</g,'&lt;')+'</p>');m.value=''}">Enviar</button></div><button class="btn g" style="margin-top:12px" onclick="closeM()">Fechar</button>`)}
function cityM(){modal(`<h2 style="margin-top:0">Escolher cidade</h2><div class="row" style="margin:14px 0">${["Brasília, DF","Goiânia, GO","São Paulo, SP"].map(c=>`<button class="chip" onclick="S.city='${c}';closeM();draw();toast('Explorando ${c}')">${c}</button>`).join("")}</div><button class="btn g" onclick="S.city='Brasília, DF';closeM();draw();toast('Usando sua localização atual')">Usar minha localização atual</button>`)}
function draw(){$("#nav").innerHTML=NAV.map(([k,l,i])=>`<button class="${S.scr==k?"on":""}" onclick="go('${k}')" ${S.scr==k?'aria-current="page"':""}>${ic(i)}${l}</button>`).join("");$("#app").innerHTML=SC[S.scr]();if(S.scr=="map")mapBody()}
$("#lg").innerHTML=ic("ticket");
setInterval(()=>{if(S.scr!="pay"||!$("#cd"))return;S.left--;if(S.left<=0){toast("Reserva expirada. Escolha os assentos novamente.");S.seats=[];go("detail");return}$("#cd").textContent="Reserva: "+Math.floor(S.left/60)+":"+String(S.left%60).padStart(2,"0")},1000);
draw();
</script>
</body>
</html>
